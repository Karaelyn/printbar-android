name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then echo "$SIGNING_KEY" | base64 -d > app/signing.jks; echo "Clé de signature fixe"; else echo "::warning::Pas de secret SIGNING_KEY : signature debug"; fi

      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename
        id: apk
        run: |
          V="1.2.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "PrintBar-v${V}.apk"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PrintBar-v${{ steps.apk.outputs.version }}
          path: PrintBar-v*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: PrintBar v${{ steps.apk.outputs.version }}
          files: PrintBar-v*.apk
          make_latest: true
